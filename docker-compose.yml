networks:
  infra-network:
    external: true

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: postilys
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=2026
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    networks:
      - infra-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=infra-network
      - traefik.http.routers.postilys.rule=Host(`postilys.moezmissaoui.com`)
      - traefik.http.routers.postilys.entrypoints=websecure
      - traefik.http.routers.postilys.tls.certresolver=myresolver
      - traefik.http.services.postilys.loadbalancer.server.port=2026
